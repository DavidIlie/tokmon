name: CI

# Docs-only changes skip CI, except README.md: the site job renders it.
on:
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - README.md
  push:
    branches: [master]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - README.md

permissions:
  contents: read

# Supersede stale pull request runs; let every master run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --prefix web install --frozen-lockfile
      # Checks and both builds are independent, so run them side by side.
      - run: pnpm run "/^(check|check:desktop|build|build:desktop)$/"

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm --prefix site install --frozen-lockfile
      - run: pnpm run check:site
      - run: pnpm run build:site
