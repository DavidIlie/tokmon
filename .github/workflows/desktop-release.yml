name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to rebuild and publish/repair
        required: true
        type: string

# Releases share GitHub's "Latest" state and update metadata. Never let two tag
# or repair runs race one another, and never cancel a release after publishing starts.
concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            label: macOS signed + notarized
            artifact: desktop-macos
          - os: windows-2022
            platform: win
            label: Windows installer
            artifact: desktop-windows
          - os: ubuntu-22.04
            platform: linux
            label: Linux
            artifact: desktop-linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'windows') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --prefix web install --frozen-lockfile
      - name: Test desktop release verifier
        run: node --test test/desktop-release-verifier.test.mjs
      - name: Verify release version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1; }
          git describe --tags --exact-match HEAD | grep -Fx "$RELEASE_TAG"
          node -e "const r=require('./package.json'),d=require('./src/desktop/package.json'),t=process.env.RELEASE_TAG; if ('v'+r.version!==t || d.version!==r.version) { console.error('tag/root/desktop versions differ', {tag:t,root:r.version,desktop:d.version}); process.exit(1) }"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - run: pnpm run check:desktop
      - run: pnpm run build
      - run: pnpm run build:desktop
      - name: Require macOS signing secrets
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: test -n "$CSC_LINK" -a -n "$CSC_KEY_PASSWORD" -a -n "$APPLE_API_KEY" -a -n "$APPLE_API_KEY_ID" -a -n "$APPLE_API_ISSUER"
      - name: Detect optional Windows signing
        if: startsWith(matrix.os, 'windows')
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "$WIN_CSC_LINK" && -n "$WIN_CSC_KEY_PASSWORD" ]]; then
            echo "WIN_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Windows Authenticode signing enabled."
          else
            echo "WIN_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Windows Authenticode signing disabled; publishing an unsigned Windows installer."
          fi
      - name: Package macOS
        if: startsWith(matrix.os, 'macos')
        working-directory: src/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          export APPLE_API_KEY="$key_path"
          pnpm exec electron-builder --config electron-builder.yml --publish never
      - name: Notarize and staple macOS disk images
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          shopt -s nullglob
          dmgs=(src/desktop/release/*.dmg)
          ((${#dmgs[@]} == 2)) || { echo "Expected two macOS DMGs, found ${#dmgs[@]}" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --key "$key_path" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done
      - name: Package Windows
        if: startsWith(matrix.os, 'windows')
        working-directory: src/desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --config electron-builder.yml --publish never
      - name: Package Linux
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: src/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --config electron-builder.yml --publish never
      - name: Verify updater artifacts and metadata
        shell: bash
        run: node scripts/verify-desktop-release.mjs --platform "${{ matrix.platform }}" --release-dir src/desktop/release --version "$RELEASE_VERSION"
      - name: Verify macOS signatures and notarization tickets
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          shopt -s nullglob
          apps=(src/desktop/release/mac*/*.app)
          ((${#apps[@]} == 2)) || { echo "Expected two packaged macOS apps, found ${#apps[@]}" >&2; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
          dmgs=(src/desktop/release/*.dmg)
          ((${#dmgs[@]} == 2)) || { echo "Expected two macOS DMGs, found ${#dmgs[@]}" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            codesign --verify --verbose=2 "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            xcrun stapler validate "$dmg"
          done
      - name: Verify Windows Authenticode signatures
        if: startsWith(matrix.os, 'windows') && env.WIN_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem src/desktop/release -File -Filter '*.exe'
            Get-ChildItem src/desktop/release/win-unpacked -File -Filter '*.exe'
          )
          if ($files.Count -lt 2) { throw "Expected the signed installer and unpacked Tokmon executable" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "Valid Authenticode signature: $($file.Name) [$($signature.SignerCertificate.Subject)]"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src/desktop/release/*.dmg
            src/desktop/release/*.zip
            src/desktop/release/*.exe
            src/desktop/release/*.AppImage
            src/desktop/release/*.deb
            src/desktop/release/latest*.yml
            src/desktop/release/*.blockmap
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Verify merged release payload
        run: node scripts/verify-desktop-release.mjs --platform all --release-dir artifacts --version "${RELEASE_TAG#v}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Verify the published GitHub update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          node scripts/verify-desktop-release.mjs --platform all --release-dir published --version "${RELEASE_TAG#v}"

  # Keep package registries behind the verified desktop release. A tag cannot
  # publish npm/GPR while signing, notarization, or update-feed verification is
  # failing. Manual desktop repair runs intentionally skip package publishing.
  publish:
    if: github.event_name == 'push'
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
